<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Log de Auditoria</title>
    <link rel="stylesheet" href="/css/usuarios.css">
    <script src="/js/auditoria.js" defer></script>
</head>
<body>
<div class="container">
    <div class="header-tabela">
        <h1>Log de Auditoria</h1>
        <a href="/auth/dashboard" class="btn-voltar">Voltar</a>
    </div>

    <div class="tabela-responsivo">
        <table>
            <thead>
            <tr>
                <th data-column="id">ID</th>
                <th data-column="nomeUsuario">Usuário</th>
                <th data-column="emailUsuario">E-mail</th>
                <th data-column="acao">Ação Executada</th>
                <th data-column="dataHora">Data/Hora</th>
            </tr>
            </thead>
            <tbody id="tabelaAuditoria">
            </tbody>
        </table>
    </div>

    <!-- Controles de Paginação -->
    <div class="paginacao">
        <button id="btnAnterior" onclick="mudarPagina(-1)">Anterior</button>
        <span id="infoPagina">Página 1 de 1</span>
        <button id="btnProximo" onclick="mudarPagina(1)">Próximo</button>
    </div>

</div>
</body>
</html>
